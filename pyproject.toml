[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-hand-teleop"
version = "0.2.0"
description = "Manus-glove and webcam teleoperation for the MIDAS hand, in MuJoCo and on hardware"
readme = "README.md"
requires-python = ">=3.10"
# Deliberately thin. The glove path -- which is the primary one and what runs
# on hardware -- needs neither opencv nor mediapipe, and those two are 252 MB
# between them, so they are the [webcam] extra rather than a required install.
dependencies = [
    "midas-hand-retargeter>=0.2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# midas-hand-teleop (the webcam entry point). detector.py already imports both
# lazily; webcam_demo names the extra if they are missing.
webcam = ["mediapipe>=0.10", "opencv-python>=4.8"]
mujoco = ["mujoco>=3.0"]
hardware = ["midas-hand>=0.1.0"]
# Manus-glove -> MuJoCo pipeline (midas-manus-teleop). Fully self-contained — no
# dyna dependency: pyzmq for the data-center bus, protobuf for the vendored glove
# message (built at runtime in manus_glove/glove_proto.py), mujoco for the sim.
manus = ["pyzmq>=25", "protobuf>=4.25", "mujoco>=3.0"]
# The browser tuner adds no WEB dependencies (stdlib http.server, vanilla JS),
# but it does need the glove bus and the sim it drives.
tuner = ["pyzmq>=25", "protobuf>=4.25", "mujoco>=3.0"]
dev = ["pytest"]

[project.scripts]
midas-hand-teleop = "midas_hand_teleop.webcam_demo:main"
midas-manus-teleop = "midas_hand_teleop.manus_glove.manus_teleop:main"
midas-manus-bridge = "midas_hand_teleop.manus_glove.manus_bridge:main"
midas-hand-diag = "midas_hand_teleop.diagnostics:main"
midas-hand-tune = "midas_hand_teleop.tuner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_hand_teleop*"]

[tool.setuptools.package-data]
"midas_hand_teleop.tuner" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "C408"]
